// 色の定義

   BLUE: 0x0051BA,

   GRAY: 0xB8B8B8
};


//定義関連
//コーナー
const CORNERS = {
    UF: 'UF',
    UL: 'UL',
    UR: 'UR',
    UB: 'UB',
    DF: 'DF',
    DL: 'DL',
    DR: 'DR',
    DB: 'DB'
};

//センター
const CENTERS = {
    U: 'U',
    D: 'D',
    FL: 'FL',
    BR: 'BR',
    FR: 'FR',
    BL: 'BL'
};

// 向きを定義
const ORIENTATIONS = {
    NEUTRAL: 0,    // 0度回転
    CLOCKWISE: 1,  // 120度回転
    COUNTER: 2     // 240度回転
};

//回転軸
const VECTORS = {
    F: [1, 1, 1],
    R: [1, 1, -1],
    B: [-1, 1, -1],
    L: [-1, 1, 1],
    f: [1, -1, 1],
    r: [1, -1, -1],
    b: [-1, -1, -1],
    l: [-1, -1, 1],
    x: [1, 0, 0],
    y: [0, 1, 0],
    z: [0, 0, 1]
};

// Skewbの状態を管理するクラス
class SkewbState {
  constructor() {
      // 各位置にあるピースと向きを管理
      this.PIECE_GROUPS = {
          UF: { piece: CORNERS.UF, orientation: ORIENTATIONS.NEUTRAL },
          UL: { piece: CORNERS.UL, orientation: ORIENTATIONS.NEUTRAL },
          UR: { piece: CORNERS.UR, orientation: ORIENTATIONS.NEUTRAL },
          UB: { piece: CORNERS.UB, orientation: ORIENTATIONS.NEUTRAL },
          DF: { piece: CORNERS.DF, orientation: ORIENTATIONS.NEUTRAL },
          DL: { piece: CORNERS.DL, orientation: ORIENTATIONS.NEUTRAL },
          DR: { piece: CORNERS.DR, orientation: ORIENTATIONS.NEUTRAL },
          DB: { piece: CORNERS.DB, orientation: ORIENTATIONS.NEUTRAL },
          U: { piece: CENTERS.U, orientation: ORIENTATIONS.NEUTRAL },
          D: { piece: CENTERS.D, orientation: ORIENTATIONS.NEUTRAL },
          FL: { piece: CENTERS.FL, orientation: ORIENTATIONS.NEUTRAL },
          BR: { piece: CENTERS.BR, orientation: ORIENTATIONS.NEUTRAL },
          FR: { piece: CENTERS.FR, orientation: ORIENTATIONS.NEUTRAL },
          BL: { piece: CENTERS.BL, orientation: ORIENTATIONS.NEUTRAL }
      };
  }


  //3つのピースを循環させる関数
  cycleThreePieces(p1, p2, p3, isClockwise = true) {
      let tmp = this.PIECE_GROUPS[p1].piece;
      if (isClockwise) {
          this.PIECE_GROUPS[p1].piece = this.PIECE_GROUPS[p2].piece;
          this.PIECE_GROUPS[p2].piece = this.PIECE_GROUPS[p3].piece;
          this.PIECE_GROUPS[p3].piece = tmp;
      } else {
          this.PIECE_GROUPS[p1].piece = this.PIECE_GROUPS[p3].piece;
          this.PIECE_GROUPS[p3].piece = this.PIECE_GROUPS[p2].piece;
          this.PIECE_GROUPS[p2].piece = tmp;
      }
  }

  //3つのピースの向きを更新する関数
  cycleThreeOrientations(p1, p2, p3, isClockwise = true) {
      let tmp = this.PIECE_GROUPS[p1].orientation;
      const delta = isClockwise ? -1 : 1;

      if (isClockwise) {
          this.PIECE_GROUPS[p1].orientation = adjustValue(this.PIECE_GROUPS[p2].orientation + delta);
          this.PIECE_GROUPS[p2].orientation = adjustValue(this.PIECE_GROUPS[p3].orientation + delta);
          this.PIECE_GROUPS[p3].orientation = adjustValue(tmp + delta);
      } else {
          this.PIECE_GROUPS[p1].orientation = adjustValue(this.PIECE_GROUPS[p3].orientation + delta);
          this.PIECE_GROUPS[p3].orientation = adjustValue(this.PIECE_GROUPS[p2].orientation + delta);
          this.PIECE_GROUPS[p2].orientation = adjustValue(tmp + delta);
      }
  }

  // 単一の回転操作を実行
  executeRotation(fixedCorner, centers, corners, isClockwise) {
      // 固定コーナーの向きを更新
      this.PIECE_GROUPS[fixedCorner].orientation =
          adjustValue(this.PIECE_GROUPS[fixedCorner].orientation + (isClockwise ? 1 : -1));

      // センターピースの回転
      this.cycleThreePieces(...centers, isClockwise);

      // コーナーピースの回転と向きの更新
      this.cycleThreePieces(...corners, isClockwise);
      this.cycleThreeOrientations(...corners, isClockwise);
  }

  // メイン回転関数
      applyMove(move, angle) {

              F: {

                  corners: ['DB', 'UR', 'DF']

                  corners: ['DL', 'UB', 'DR']
              },
              l: {
                  fixedCorner: 'DL',
                  centers: ['D', 'FL', 'BL'],
                  corners: ['DF', 'UL', 'DB']
              }
          };

          const config = rotationConfig[move];
          if (config) {
              this.executeRotation(
                  config.fixedCorner,
                  config.centers,
                  config.corners,
                  isClockwise
              );
          }
      }



      getRotationNotation(axis, angle) {
          switch (angle) {
              case -90:
                  return axis;
              case 90:
                  return `${axis}'`;
              case 180:
              case -180:
                  return `${axis}2`;
              default:
                  return 'invalid angle';
          }
      }

// 値が0未満なら3を足し、3以上なら3を引く関数
function adjustValue(value) {
    if (value < 0) {
        return value + 3;
    } else if (value >= 3) {
        return value - 3;
    }
    return value;
}

function getRotationMatrix(axis, angle) {
    const rad = degToRad(angle);
    const [x, y, z] = VECTORS[axis];
//    const [x, y, z] = skewb.ROTATION_VECTORS[axis].vector;
    const axisVector = new THREE.Vector3(x, y, z)
    .normalize();
//    .applyQuaternion(cubeGroup.quaternion);
    const rotationMatrix = new THREE.Matrix4();
    rotationMatrix.makeRotationAxis(axisVector, rad);
    return rotationMatrix;
}

// 【バグ修正】animationGroupの姿勢を初期状態（回転なし）に戻す
// 以前は前回の回転が残ったまま再利用され、行列⇔クォータニオン変換のたびに
// 誤差が数倍ずつ増幅し、数十〜数百手でピースが歪んで状態とずれていた
function resetAnimationGroup() {
    animationGroup.position.set(0, 0, 0);
    animationGroup.quaternion.identity();
    animationGroup.scale.set(1, 1, 1);
    animationGroup.updateMatrix();
    animationGroup.updateMatrixWorld(true);
}

// 【バグ修正】ピースの行列を正確な値に丸める
// Skewbの回転(120度)と持ち替え(90度)はどちらも立方体の対称操作なので、
// ピースの行列の成分は必ず -1, 0, 1 のどれかになる。毎回丸めて誤差を消す
function snapPieceMatrix(piece) {
    const e = piece.matrix.elements;
    for (let i = 0; i < 16; i++) {
        e[i] = Math.round(e[i]) + 0; // +0 で -0 を 0 にする
    }
    piece.matrix.decompose(piece.position, piece.quaternion, piece.scale);
    piece.matrixWorldNeedsUpdate = true;
}

// 回転アニメーションを実行する関数
function rotateGroup(axis, angle) {
    if (isAnimating) return;
    isAnimating = true;
skewb.printState();
    // アニメーショングループをクリア
    while(animationGroup.children.length > 0) {
//      cubeGroup.attach(animationGroup.children[0]);
      scene.attach(animationGroup.children[0]);
    }
    // 【バグ修正】前回の回転がanimationGroupに残ったままだと誤差が蓄積・増幅するので毎回初期化する
    resetAnimationGroup();

    // 現在の状態に基づいて回転軸の情報を取得
    const rotationAxis = getRotationAxisPieces(axis, skewb);
/*
    // 対象のピースを見つけて追加
    const targetPieces = cubeGroup.children.filter(child =>
        rotationAxis.pieces.includes(child.userData.group)
    );
*/

    // 対象のピースを見つけて追加
    const targetPieces = scene.children.filter(child =>
      rotationAxis.pieces.includes(child.userData.group)
    );

    targetPieces.forEach(piece => {
      piece.updateMatrix();
      animationGroup.attach(piece);
    });

//    cubeGroup.add(animationGroup);
    scene.add(animationGroup);

    // アニメーションの設定
    const duration = 100;
    const startTime = Date.now();
    const rotationMatrix = getRotationMatrix(axis, angle);

    // 四元数の準備
    const startQuaternion = new THREE.Quaternion().setFromRotationMatrix(animationGroup.matrix);
    const endQuaternion = new THREE.Quaternion();
    const resultQuaternion = new THREE.Quaternion();

    endQuaternion.multiplyQuaternions(
      new THREE.Quaternion().setFromRotationMatrix(rotationMatrix),
      startQuaternion
    );

    function update() {
      const currentTime = Date.now();
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const easeProgress = 1 - Math.cos((progress * Math.PI) / 2);

      resultQuaternion.slerpQuaternions(startQuaternion, endQuaternion, easeProgress);

      // 【バグ修正】行列を経由せず、正規化したクォータニオンを直接設定する
      animationGroup.quaternion.copy(resultQuaternion).normalize();

      if (progress < 1) {
        requestAnimationFrame(update);
      } else {
        // 最終フレームは補間せず、正確な終了姿勢にする
        animationGroup.quaternion.copy(endQuaternion).normalize();
//        cubeGroup.updateMatrixWorld();
        scene.updateMatrixWorld();
        targetPieces.forEach(piece => {
          const worldMatrix = piece.matrixWorld.clone();
//          cubeGroup.attach(piece);
          scene.attach(piece);
          piece.matrix.copy(worldMatrix);
//          piece.matrix.premultiply(new THREE.Matrix4().copy(cubeGroup.matrix).invert());
          piece.matrix.premultiply(new THREE.Matrix4().copy(scene.matrix).invert());
          piece.matrixAutoUpdate = false;
          // 【バグ修正】回転後の行列を正確な値（-1, 0, 1）に戻して誤差をリセット
          snapPieceMatrix(piece);
        });
        animationGroup.clear();
        resetAnimationGroup();
        skewb.applyMove(axis, angle);
        skewb.printState();
        isAnimating = false;
      }
    }
    update();

}

        endQuaternion.multiplyQuaternions(

          startQuaternion
        );

               resultQuaternion.slerpQuaternions(startQuaternion, endQuaternion, easeProgress);

// 角度を-PI〜PIの範囲に正規化する関数
function normalizeAngle(angle) {
    while (angle > Math.PI) angle -= 2 * Math.PI;
    while (angle < -Math.PI) angle += 2 * Math.PI;
    return angle;
}

function createOutline(geometry) {
    const edges = new THREE.EdgesGeometry(geometry);

    return new LineSegments2(lineGeometry, OUTLINE_MATERIAL);

// 【追加】視点（カメラ）を起動時の位置 (4, 4, 4) へなめらかに戻す
function returnCameraHome() {
    if (isReturningHome) return;
    isReturningHome = true;
    controls.enabled = false;  // 戻している間は視点を回せないようにする

    const homePosition = new THREE.Vector3(4, 4, 4);
    const radius = homePosition.length();
    const startQuaternion = camera.quaternion.clone();
    // 起動時の視点（(4,4,4) から原点を見る、上方向は +Y）の向き
    const homeMatrix = new THREE.Matrix4().lookAt(homePosition, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 1, 0));
    const endQuaternion = new THREE.Quaternion().setFromRotationMatrix(homeMatrix);

    const duration = 250;
    const startTime = performance.now();

    function step() {
        const t = Math.min((performance.now() - startTime) / duration, 1);
        const ease = 1 - Math.pow(1 - t, 3);
        const q = new THREE.Quaternion().slerpQuaternions(startQuaternion, endQuaternion, ease);
        // 原点を見たまま、球面に沿ってカメラを動かす
        camera.quaternion.copy(q);
        camera.position.set(0, 0, radius).applyQuaternion(q);
        camera.up.set(0, 1, 0).applyQuaternion(q);

        if (t < 1) {
            requestAnimationFrame(step);
        } else {
            // 最後は正確に起動時の視点にする
            camera.position.copy(homePosition);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0);
            controls.enabled = isControlEnabled;
            isReturningHome = false;
        }
    }
    requestAnimationFrame(step);
}

// イベントハンドラ
function onStart(event) {
    if (!isControlEnabled) {
        event.preventDefault();
        isDragging = true;
        dominantAxis = null;

        const pos = getEventPosition(event);
        previousPosition = {
            x: pos.x,
            y: pos.y
        };
    }
}

function onMove(event) {
    if (!isControlEnabled && isDragging) {
        event.preventDefault();

        const pos = getEventPosition(event);
        const deltaMove = {
            x: pos.x - previousPosition.x,
            y: pos.y - previousPosition.y
        };

        if (!dominantAxis) {
            // ドラッグの方向を判定
            if (Math.abs(deltaMove.x) > 15 || Math.abs(deltaMove.y) > 15) {
                // x軸回転: 左下から右上、または右上から左下への動き
                if ((Math.abs(deltaMove.x) > 15 && Math.abs(deltaMove.y) > 15) &&
                    ((deltaMove.x > 0 && deltaMove.y < 0) || (deltaMove.x < 0 && deltaMove.y > 0))) {
                    dominantAxis = 'x';
                }
                // y軸回転: 水平方向の動き
                else if (Math.abs(deltaMove.x) > Math.abs(deltaMove.y) * 2.5) {
                    dominantAxis = 'y';
                }
                // z軸回転: 左上から右下、または右下から左上への動き
                else if ((Math.abs(deltaMove.x) > 20 && Math.abs(deltaMove.y) > 20) &&
                        ((deltaMove.x > 0 && deltaMove.y > 0) || (deltaMove.x < 0 && deltaMove.y < 0))) {
                    dominantAxis = 'z';
                }
            }
        } else {
            // 回転の実行
            switch (dominantAxis) {
                case 'x':
                    const diagonalX = (deltaMove.x - deltaMove.y) / 2; // x軸用の斜め計算
                    if (Math.abs(diagonalX) >= 80) {
                        // 左下から右上（x）、右上から左下（x'）
                        const direction = diagonalX > 0 ? -90 : 90;
                        rotateCube('x', direction);
                        previousPosition = { x: pos.x, y: pos.y };
                    }
                    break;
                case 'y':
                    if (Math.abs(deltaMove.x) >= 120) {
                        // 右から左（y）、左から右（y'）
                        const direction = deltaMove.x < 0 ? -90 : 90;
                        rotateCube('y', direction);
                        previousPosition.x = pos.x;
                    }
                    break;
                case 'z':
                    const diagonalZ = (deltaMove.x + deltaMove.y) / 2; // z軸用の斜め計算
                    if (Math.abs(diagonalZ) >= 80) {
                        // 左上から右下（z）、右下から左上（z'）
                        const direction = diagonalZ > 0 ? -90 : 90;
                        rotateCube('z', direction);
                        previousPosition = { x: pos.x, y: pos.y };
                    }
                    break;
            }
        }
    }
}

function onEnd() {
    isDragging = false;
    dominantAxis = null;

}

// イベントの座標を取得するユーティリティ関数
function getEventPosition(event) {
    if (event.touches) {
        // タッチイベントの場合
        return {
            x: event.touches[0].clientX,
            y: event.touches[0].clientY
        };
    } else {
        // マウスイベントの場合
        return {
            x: event.clientX,
            y: event.clientY
        };
    }
}

        handleEnd(e);
    });

    // ドラッグ開始時の「指/カーソル」と「フリック部品の右下」とのずれ（掴んだ位置を保つため）
    let dragOffsetRight = 0;
    let dragOffsetBottom = 0;
    let lastPointerPos = { x: 0, y: 0 };  // 最新の指/カーソルの位置

    function handleStart(e) {
        e.preventDefault();
        const button = e.currentTarget;
        const currentTime = new Date().getTime();
        dragStartTime = currentTime;  // 長押し判定用の時間を記録

        // ダブルタップの判定（同じ四角を続けてタップしたときだけ）
        const tapLength = currentTime - lastTapTime;
        const isDoubleTap = tapLength < doubleTapDelay && tapLength > 0 && button === lastTapButton;

        activeButton = button;
        flickOptions = button.querySelector('.flick-options');
        isFlicking = true;
        const pos = getEventPosition(e);
        startX = pos.x;
        startY = pos.y;
        lastPointerPos = pos;

        if (isDoubleTap) {
            // ダブルタップ：B→F、R→L に切り替え（指を離すと元に戻る）
            isAlternateMode = true;
            lastTapTime = 0;  // 3回目のタップをダブルタップと数えない
            updateFlickOptions();
            button.classList.add('open');
            document.getElementById('flick-control').classList.add('flick-open');  // 【追加】もう一方の四角を背景の後ろへ
            flickOptions.classList.remove('hidden');
            // 【変更】四角の位置移動は「ダブルタップ＆3秒長押し」のときだけ
            startLongPressTimer();
            return;
        }

        lastTapTime = currentTime;
        lastTapButton = button;

        // 通常のタップ処理
        updateFlickOptions();
        button.classList.add('open');
            document.getElementById('flick-control').classList.add('flick-open');  // 【追加】もう一方の四角を背景の後ろへ
        flickOptions.classList.remove('hidden');
    }

    // 長押しタイマー（ダブルタップの2回目を押したままにすると、四角の位置移動モードになる）
    function startLongPressTimer() {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
        }
        longPressTimer = setTimeout(() => {
            longPressTimer = null;
            if (isFlicking) {  // 回転記号を選び始めていない場合のみ実行
                isDraggingButton = true;
                isFlicking = false;
                hideFlickOptions();

                // オーバーレイを表示
                document.getElementById('drag-overlay').classList.remove('hidden');

                // 【バグ修正】四角を指/カーソルの位置へ飛ばさず、掴んだ位置のずれを記録する
                const flickControl = document.getElementById('flick-control');
                const rect = flickControl.getBoundingClientRect();
                dragOffsetRight = rect.right - lastPointerPos.x;
                dragOffsetBottom = rect.bottom - lastPointerPos.y;
            }
        }, LONG_PRESS_DELAY);
    }

    // 回転記号を隠す
    function hideFlickOptions() {
        document.querySelectorAll('.flick-options').forEach(o => o.classList.add('hidden'));
        document.querySelectorAll('.flick-square').forEach(b => b.classList.remove('open'));
        document.getElementById('flick-control').classList.remove('flick-open');
        document.querySelectorAll('.flick-option').forEach(o => o.classList.remove('active'));
    }

    // 【変更】四角と回転記号の表示を更新（ダブルタップ中の四角だけ F / L の表示にする）
    function updateFlickOptions() {
        flickButtons.forEach(button => {
            const group = button.dataset.group;
            const mode = (isAlternateMode && button === activeButton) ? 'alternate' : 'normal';
            const labels = FLICK_LABELS[group][mode];
            button.querySelector('.flick-label').textContent = labels.center;
            button.querySelectorAll('.flick-option').forEach(option => {
                option.textContent = labels[option.dataset.dir];
            });
        });
    }

    function handleMove(e) {
        e.preventDefault();
        const pos = getEventPosition(e);
        lastPointerPos = pos;

        // ドラッグ中の移動処理
        if (isDraggingButton) {
            const flickControl = document.getElementById('flick-control');

            // 画面端からの最小距離
            const minDistance = 70;

            // 新しい位置を計算
            // 【バグ修正】掴んだ位置のずれを保ったまま移動する
            let newBottom = window.innerHeight - pos.y - dragOffsetBottom;
            let newRight = window.innerWidth - pos.x - dragOffsetRight;

            // 位置の制限
            newBottom = Math.max(minDistance, Math.min(window.innerHeight - minDistance, newBottom));
            newRight = Math.max(minDistance, Math.min(window.innerWidth - minDistance, newRight));

            // 制限された位置を適用
            flickControl.style.bottom = `${newBottom}px`;
            flickControl.style.right = `${newRight}px`;
            return;
        }

        // 通常のフリック処理
        // 【変更】動かしただけでは回転しない。指/カーソルが乗っている回転記号を強調表示し、
        //         離したときに枠の中なら回転する（handleEnd で実行）
        if (!isDraggingButton && isFlicking) {
            const deltaX = pos.x - startX;
            const deltaY = pos.y - startY;

            // 回転記号を選ぶために動かし始めたら、長押し（位置移動）にはしない
            if ((Math.abs(deltaX) > 30 || Math.abs(deltaY) > 30) && longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }

            const hovered = getOptionAt(pos);
            document.querySelectorAll('.flick-option').forEach(option => {
                option.classList.toggle('active', option === hovered);
            });
        }
    }

    // 【変更】指定した位置にある回転記号の枠（四角）を返す。表示中の4つだけが対象。枠の外なら null
    function getOptionAt(pos) {
        if (!flickOptions || flickOptions.classList.contains('hidden')) return null;
        const options = flickOptions.querySelectorAll('.flick-option');
        for (const option of options) {
            const r = option.getBoundingClientRect();
            if (pos.x >= r.left && pos.x <= r.right && pos.y >= r.top && pos.y <= r.bottom) {
                return option;
            }
        }
        return null;
    }

    // 【追加】枠の外で離したとき、押した位置からの方向（上下左右）で回転記号を選ぶ
    //         押した四角の外まで動かしていない（四角の中で離した）ときは null（回転しない）
    function getOptionByDirection(pos) {
        if (!flickOptions || flickOptions.classList.contains('hidden')) return null;
        const dx = pos.x - startX;
        const dy = pos.y - startY;
        if (Math.hypot(dx, dy) < FLICK_MIN_DISTANCE()) return null;
        let dir;
        if (Math.abs(dx) > Math.abs(dy)) {
            dir = dx > 0 ? 'right' : 'left';
        } else {
            dir = dy > 0 ? 'down' : 'up';
        }
        return flickOptions.querySelector(`.flick-option[data-dir="${dir}"]`);
    }

/*
    function handleMove(e) {
        if (!isFlicking) return;
        e.preventDefault();

        const pos = getEventPosition(e);
        const deltaX = pos.x - startX;
        const deltaY = pos.y - startY;
        const angle = Math.atan2(deltaY, deltaX) * 180 / Math.PI;

        // 方向に基づいて回転を決定
        if (Math.abs(deltaX) > 30 || Math.abs(deltaY) > 30) {
            const move = determineMove(angle);
            if (move) {
                executeMove(move);
                isFlicking = false;
                flickOptions.classList.add('hidden');
            }
        }

    }
*/
    function handleEnd(e) {
      // 【改善】指/カーソルを離した位置を正確に取る
      //         （速いフリックでは最後の move イベントが離した位置より手前のことがある）
      if (e && e.changedTouches && e.changedTouches.length > 0) {
          lastPointerPos = { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
      } else if (e && typeof e.clientX === 'number') {
          lastPointerPos = { x: e.clientX, y: e.clientY };
      }

      // 回転記号の枠の中で離したら、その記号の回転をする
      //  （表示中の記号＝textContent を使うので、ダブルタップの F・L 表示にも対応）
      // 【改善】速いフリックで枠に届かなかった／通り過ぎた場合は、フリックした方向（上下左右）で判定する
      let flicked = false;
      if (isFlicking && !isDraggingButton) {
          const option = getOptionAt(lastPointerPos) || getOptionByDirection(lastPointerPos);
          if (option) {
              executeMove(option.textContent.trim());
              flicked = true;
          }
      }
      // 【改善】フリックした場合は「タップ」ではないので、次のタップをダブルタップと数えない
      //         （速く続けてフリックしたとき、2回目が F・L になってしまうのを防ぐ）
      if (flicked || Math.hypot(lastPointerPos.x - startX, lastPointerPos.y - startY) > FLICK_MIN_DISTANCE()) {
          lastTapTime = 0;
      }
      // タイマーをクリア
      if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
      }

      if (isDraggingButton) {
          // ドラッグ終了時の処理
          document.getElementById('drag-overlay').classList.add('hidden');
      }

        isDragging = false;
        isFlicking = false;
        isDraggingButton = false;
        hideFlickOptions();

        // モードを元に戻す（指を離すと F→B、L→R の表示に戻る）
        isAlternateMode = false;
        updateFlickOptions();
        activeButton = null;
        flickOptions = null;
    }

    function determineMove(angle) {
        if (isAlternateMode) {
            // L,l,F,fモード
            const sectors = {
                'l': [-22.5, 22.5],      // 上 (-45度〜45度)
                'l\'':[22.5, 67.5],
                'L': [67.5, 112.5],      // 右 (45度〜135度)
                'L\'':[112.5, 157.5],
                'f': [157.5, -157.5],    // 下 (135度〜-135度)
                'f\'':[-157.5, -112.5],
                'F': [-112.5, -67.5,],    // 左 (-135度〜-45度)
                'F\'':[-67.5, -22.5]
            }
            for (const [move, [min, max]] of Object.entries(sectors)) {
              if (min <= max) {
                if (angle >= min && angle < max) return move;
              } else {
                if (angle >= min || angle < max) return move;
              }
            }
        } else {
            // R,r,B,bモード
            const sectors = {
                'r': [-22.5, 22.5],      // 上 (-45度〜45度)
                'r\'':[22.5, 67.5],
                'R': [67.5, 112.5],      // 右 (45度〜135度)
                'R\'':[112.5, 157.5],
                'b': [157.5, -157.5],    // 下 (135度〜-135度)
                'b\'':[-157.5, -112.5],
                'B': [-112.5, -67.5,],    // 左 (-135度〜-45度)
                'B\'':[-67.5, -22.5]
            }
            for (const [move, [min, max]] of Object.entries(sectors)) {
              if (min <= max) {
                if (angle >= min && angle < max) return move;
              } else {
                if (angle >= min || angle < max) return move;
              }
            }
        }
        return null;
    }


    // 【改善】回転のアニメーション中に入力された回転を捨てずに、順番に実行する
    function queueRotation(axis, angle) {
        pendingRotations.push([axis, angle]);
        if (pendingRotations.length === 1) processRotationQueue();
    }
    function processRotationQueue() {
        if (pendingRotations.length === 0) return;
        if (isAnimating) {
            requestAnimationFrame(processRotationQueue);  // 前の回転が終わるのを待つ
            return;
        }
        const [axis, angle] = pendingRotations.shift();
        rotateGroup(axis, angle);
        if (pendingRotations.length > 0) requestAnimationFrame(processRotationQueue);
    }

    function executeMove(move) {
      // 長押しタイマーをクリア
      if (longPressTimer) {
          clearTimeout(longPressTimer);
          longPressTimer = null;
      }

      isFlicking = false;  // フリック操作の完了を示す

        switch(move) {
            case 'R':
                queueRotation('R', -120);
                break;
            case 'R\'':
                queueRotation('R', 120);
                break;
            case 'r':
                queueRotation('r', -120);
                break;
            case 'r\'':
                queueRotation('r', 120);
                break;
            case 'B':
                queueRotation('B', -120);
                break;
            case 'B\'':
                queueRotation('B', 120);
                break;
            case 'b':
                queueRotation('b', -120);
                break;
            case 'b\'':
                queueRotation('b', 120);
                break;
            case 'F':
                queueRotation('F', -120);
                break;
            case 'F\'':
                queueRotation('F', 120);
                break;
            case 'f':
                queueRotation('f', -120);
                break;
            case 'f\'':
                queueRotation('f', 120);
                break;
            case 'L':
                queueRotation('L', -120);
                break;
            case 'L\'':
                queueRotation('L', 120);
                break;
            case 'l':
                queueRotation('l', -120);
                break;
            case 'l\'':
                queueRotation('l', 120);
                break;
        }
    }
    // 回転実行後、モードと表示を元に戻す
    if (isAlternateMode) {
      isAlternateMode = false;
      updateFlickOptions();
    }
}


function initDragOverlay() {
    const overlay = document.getElementById('drag-overlay');
    overlay.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
    });
    overlay.addEventListener('touchstart', (e) => {
        e.preventDefault();
        e.stopPropagation();
    });
    overlay.addEventListener('touchmove', (e) => {
        e.preventDefault();
        e.stopPropagation();
    });
}



function animate() {
    requestAnimationFrame(animate);
    if (isControlEnabled) {
        controls.update();
    }
    // 【追加】輪郭線の太さを画面の大きさに合わせる（画面サイズが変わっても太さを保つ）
    renderer.getSize(OUTLINE_MATERIAL.resolution);
    renderer.render(scene, camera);
}


        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            controls.handleResize(); // コントロールの状態を更新
        }

        // DOMContentLoadedを待ってから初期化
        document.addEventListener('DOMContentLoaded', () => {
            init();
        });
